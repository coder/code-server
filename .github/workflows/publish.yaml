name: Publish code-server

on:
  # Shows the manual trigger in GitHub UI
  # helpful as a back-up in case the GitHub Actions Workflow fails
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true

  release:
    types: [released]

permissions: {}

# Cancel in-progress runs for pull requests when developers push
# additional changes, and serialize builds in branches.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-concurrency-to-cancel-any-in-progress-job-or-run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing is published unless the release came from release.yaml: coder-release-publisher made
  # it (only release.yaml's approve job can sign as that App, after a second person approved), it
  # is published and immutable, and every file was built and attested by release.yaml from main.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check the release
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # TAG comes from the dispatch input, so only a version may reach the shell.
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || fail "The version must look like v1.2.3 or v1.2.3-rc.1."
          tag="v${TAG#v}"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          author="$(jq -r .author.login <<<"$release")"
          [[ "$author" == "coder-release-publisher[bot]" ]] || fail "$tag was published by $author, not by release.yaml (coder-release-publisher)."
          [[ "$(jq -r .draft <<<"$release")" == "false" ]] || fail "$tag is a draft."
          [[ "$(jq -r .immutable <<<"$release")" == "true" ]] || fail "$tag is not an immutable release."

      - name: Verify the files
        run: |
          set -euo pipefail
          tag="v${TAG#v}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release-files
          for f in release-files/*; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done

  npm:
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      # Required so GitHub can issue an OIDC token for trusted publishing.
      id-token: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
      NPM_ENVIRONMENT: "production"

    steps:
      - name: Set version to tag without leading v
        run: |
          # TAG comes from the dispatch input, so only a version may reach GITHUB_ENV and the shell.
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::The version must look like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: "coder/code-server"
          tag: ${{ env.TAG }}
          fileName: "package.tar.gz"
          out-file-path: "release-npm-package"

      - run: tar -xzf release-npm-package/package.tar.gz
      - run: |
          pushd release
          npm publish --tag latest --access public

  aur:
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      contents: read
      id-token: write # Cloud KMS signs the coder-automations App's JWT
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Set version to tag without leading v
        run: |
          # TAG comes from the dispatch input, so only a version may reach GITHUB_ENV and the shell.
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::The version must look like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Generate coder-automations app token
        id: app_token
        # The App's key is a non-exportable Cloud KMS key; only this workflow, in this environment,
        # may sign with it.
        uses: coder/github-app-token-action@00eaec58ee1bfea9c8b48655b7ab7470b07739e5 # main 2026-11-17
        with:
          client-id: ${{ secrets.CODER_AUTOMATION_APP_ID }}
          kms-key: ${{ secrets.CODER_AUTOMATION_APP_KMS_KEY }}
          workload-identity-provider: ${{ secrets.APP_KEYS_WORKLOAD_ID_PROVIDER }}
          owner: coder
          repositories: code-server-aur
          permissions: |
            contents: write
            pull_requests: write

      - name: Checkout code-server-aur repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: "cdrci/code-server-aur"
          token: ${{ steps.app_token.outputs.token }}
          ref: "master"

      - name: Configure git
        run: |
          git config --global user.name cdrci
          git config --global user.email opensource@coder.com

      - name: Fetch and reset master
        run: |
          git remote add upstream https://github.com/coder/code-server-aur.git
          git fetch upstream
          git reset --hard upstream/master
          git push --force

      - name: Validate package
        uses: heyhusen/archlinux-package-action@3f7aaada28c782497bfe02d6d6ea365b25fdea12 # v3.0.1
        with:
          pkgver: ${{ env.VERSION }}
          updpkgsums: true
          srcinfo: true

      - name: Open PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git checkout -b "update-version-$VERSION"
          git add .
          git commit -m "Update to $VERSION"
          git push -u origin "$(git branch --show)"
          gh pr create \
            --repo coder/code-server-aur \
            --title "Update to $VERSION" \
            --body "PR opened by @$GITHUB_ACTOR" \
            --assignee "$GITHUB_ACTOR"

  docker:
    runs-on: ubuntu-latest
    needs: verify
    # Scopes the Docker Hub OIDC subject claim to
    # repo:coder/code-server:environment:release.
    environment: release
    permissions:
      # Required so GitHub can issue an OIDC token for the Docker Hub login.
      id-token: write
      # Required to push images to ghcr.io.
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Set version to tag without leading v
        run: |
          # TAG comes from the dispatch input, so only a version may reach GITHUB_ENV and the shell.
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::The version must look like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Authenticates to Docker Hub via OIDC (workload identity federation)
      # instead of a stored username/password. Requires an OIDC connection
      # configured for the org in Docker Home (Identity & auth > OIDC
      # connections) and the `id-token: write` permission above.
      - name: Login to Docker Hub with OIDC
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: codercom
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: "coder/code-server"
          tag: v${{ env.VERSION }}
          fileName: "*.deb"
          out-file-path: "release-packages"
      - uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: "coder/code-server"
          tag: v${{ env.VERSION }}
          fileName: "*.rpm"
          out-file-path: "release-packages"

      - run: ./ci/steps/docker-buildx-push.sh

  repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push the branch.
      pull-requests: write # To open the PR.
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    needs: docker

    steps:
      - name: Set version to tag without leading v
        run: |
          # TAG comes from the dispatch input, so only a version may reach GITHUB_ENV and the shell.
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::The version must look like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - run: ./ci/build/update-repo.sh

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name cdrci
          git config --global user.email opensource@coder.com
          git checkout -b "helm/$VERSION"
          git add .
          git commit -m "Update Helm chart and changelog with $VERSION"
          git push -u origin "$(git branch --show)"
          gh pr create \
            --repo coder/code-server \
            --body-file .cache/checklist \
            --title "Update Helm chart and changelog with $VERSION"
