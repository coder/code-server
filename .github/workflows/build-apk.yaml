name: Build MyCode APK

# Manual trigger - Actions tab එකෙන් "Run workflow" click කරන්න
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (Gradle/Android build සඳහා)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest runner එකේ Android SDK දැනටමත් install වෙලා තියෙනවා,
      # ඒ නිසා android-actions/setup-android එක ඕන නෑ (ඒක 'tools' කියන
      # ඉවත් කරපු legacy package එකක් හොයන්න try කරලා fail වුනා).
      # SDK path එක export කරනවා විතරයි.
      - name: Set Android SDK env
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      # Capacitor project එක repo root එකේ මේ files තියෙනවා
      # (capacitor.config.ts, www/index.html) කියලා assume කරනවා
      - name: Install Capacitor dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mycode-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
